# ==============================================================================
# Eruwine Port Configuration File
# ==============================================================================

# Human-readable game title (Used for notifications and Sway focus fallback)
GAME_NAME="Generic Windows Game"

# Unique identifier for the port (used for process naming)
GAME_ID="eruwine"

# Primary game executable filename or array of fallback candidates
GAME_EXE="game.exe"
GAME_EXES=("game.exe" "launch.exe" "main.exe")

# Rendering Backend: "gl" (Panfrost Mesa OpenGL) or "vulkan" (DXVK Vulkan)
WINE_RENDERER="gl"

# Execution Locale (e.g., ko_KR.UTF-8, ja_JP.UTF-8, en_US.UTF-8)
LOCALE="ko_KR.UTF-8"

# Wine DLL Overrides string
DLL_OVERRIDES="mscoree,mshtml=;quartz,devenum,wmp=builtin,native;xaudio2_7,xaudio2_0=builtin"

# Wine Prefix Configuration:
# By default, Eruwine uses a portable wineprefix inside the port directory ($GAMEDIR/wineprefix).
# To share a global prefix under /storage/eruwine-prefixes/, uncomment and set WINE_PREFIX_NAME:
# WINE_PREFIX_NAME="eruwine"
# Or specify an absolute custom path with WINEPREFIX_PATH:
# WINEPREFIX_PATH="/storage/eruwine-prefixes/custom"

# (Optional) Advanced Sway Focus Patterns - Leave commented for automatic resolution
# SWAY_FOCUS_TARGETS=("Custom Window Title")
